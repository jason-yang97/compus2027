<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秋招雷达 · 27届校招与实习信息看板</title>
<meta name="description" content="27届秋招/实习信息看板：多源公开信息聚合，支持企业类型、行业、城市、届次、批次、学历、截止日期等多维筛选，每日自动更新">
<link rel="stylesheet" href="style.css?v=20261012a">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
</head>
<body>
<header class="hero">
  <div class="hero-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="34" height="34">
          <circle cx="24" cy="24" r="21" fill="none" stroke="rgba(255,255,255,.30)" stroke-width="2"/>
          <circle cx="24" cy="24" r="13" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="2"/>
          <circle cx="24" cy="24" r="5" fill="#fff"/>
          <path d="M24 24 L40 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>秋招雷达</h1>
        <p class="brand-sub">27 届校招 · 实习信息看板 · 每日自动更新</p>
      </div>
    </div>
    <div class="hero-search">
      <input id="search" type="search" placeholder="搜索公司 / 岗位 / 专业 / 备注…" autocomplete="off">
      <button id="search-clear" class="search-clear" title="清空搜索" hidden>×</button>
    </div>
  </div>
  <div class="hero-stats"><span id="meta" class="stat">加载中…</span></div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main class="container">
  <section class="filter-bar" id="filter-bar">
    <div class="filters" id="filters"></div>
    <div class="filter-extra">
      <label class="sort-label">排序
        <select id="sort">
          <option value="upd">最近更新</option>
          <option value="start">最新发布</option>
          <option value="dl">截止日期最早</option>
          <option value="c">公司名称</option>
        </select>
      </label>
      <button id="past-toggle" class="btn-mode active" title="隐藏只有 2026 届及以前的往届记录">隐藏往届</button>
      <button id="split-toggle" class="btn-mode active" title="把一行里的多个岗位展开成独立行显示">岗位拆分</button>
      <button id="full-toggle" class="btn-mode" title="取消行高限制，完整展示岗位/公司文本">完整显示</button>
      <button id="reset" class="btn-reset" hidden>重置筛选</button>
    </div>
  </section>

  <div class="result-meta" id="result-meta"></div>

  <section class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th class="th-c">公司</th>
          <th class="th-r">招聘岗位</th>
          <th class="th-loc">工作地点</th>
          <th class="th-yrs">届次</th>
          <th class="th-batch">批次</th>
          <th class="th-dl">截止</th>
          <th class="th-start">开始</th>
          <th class="th-test">笔试</th>
          <th class="th-ent">企业 / 行业</th>
          <th class="th-link">链接</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" hidden>
      <p>没有符合条件的记录</p>
      <button class="btn-reset" onclick="resetFilters()">清除全部筛选</button>
    </div>
    <div class="loading" id="loading">数据加载中…</div>
  </section>

  <div class="pager" id="pager"></div>

  <footer class="footer">
    <p class="foot-line">数据来源：公开招聘信息汇总（多源聚合）· 每日自动更新 · 仅供求职参考，投递前请以官方公告为准</p>
    <p class="foot-line muted">使用提示：点击行可展开学历/专业/备注/岗位描述详情；筛选器可叠加；表头与格线可拖动调整；链接每日验活、失效自动下架。
      ｜ <a href="#" id="admin-link">管理后台</a></p>
  </footer>
</main>

<script src="app.js?v=20261013a"></script>
</body>
</html>
