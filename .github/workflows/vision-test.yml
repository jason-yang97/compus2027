name: vision-test

# 视觉模型与 AI Gateway 连通性测试（推送或手动触发）
on:
  push:
    branches: [main]
    paths:
      - 'tools/vision_test.py'
      - '.github/workflows/vision-test.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行视觉模型与网关测试
        run: python tools/vision_test.py
        env:
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          CF_AIG_TOKEN: ${{ secrets.CF_AIG_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: 提交测试结果
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f vision_test_result.json
          git diff --cached --quiet || git commit -m "视觉模型测试结果 [skip ci]"
          git push
