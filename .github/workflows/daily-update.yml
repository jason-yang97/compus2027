name: daily-update

# 每天北京时间 8:00（UTC 0:00）自动更新；推送代码后也会跑一次；可在 Actions 页面手动触发
# 运行在本机自托管 runner 上（国内网络，验活快）
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  update:
    runs-on: [self-hosted, windows]
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
    concurrency:
      group: daily-update
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install playwright

      - name: 全量抓取（飞书汇总表 + 飞书招聘系统 + GitHub 源）
        run: python tools/scraper/fetch_feishu_all.py

      - name: 链接验活（剔除已下架岗位）
        run: python tools/validate_feishu_links.py

      - name: 构建网页数据
        run: python tools/build_web.py

      - name: 部署到 Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy web --project-name compus2027 --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
