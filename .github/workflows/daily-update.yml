name: daily-update

# 每天北京时间 8:00（UTC 0:00）云端自动更新：抓取 → 验活（校招范围）→ 构建 → 部署
# 验活结果提交回仓库，供次日复用与人工查看
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
    concurrency:
      group: daily-update
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb

      - name: 安装依赖
        run: pip install playwright

      - name: 视觉读图补工作地点（新增文章，限额）
        run: python tools/vision_locations.py --max-articles 40
        env:
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        continue-on-error: true

      - name: 全量抓取
        run: python tools/scraper/fetch_feishu_all.py

      - name: 链接验活·第一遍（校招/实习范围）
        run: python tools/validate_feishu_links.py --scope campus --timeout-min 25

      - name: 判断今天是否验社招（隔天轮换，控制 Actions 免费额度）
        id: socialday
        run: echo "run=$([ $(( $(date +%j) % 2 )) -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: 链接验活·第二遍（社招范围，隔天）
        if: steps.socialday.outputs.run == 'true'
        run: python tools/validate_feishu_links.py --scope social --timeout-min 35

      - name: 构建网页数据（读取验活结果剔除已下架岗位）
        run: python tools/build_web.py

      - name: 部署到 Cloudflare Pages
        run: npx --yes wrangler@latest pages deploy web --project-name compus2027 --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 回写验活结果到仓库（失败不影响部署）
        continue-on-error: true
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f web/data/link_check.json recruit/data/feishu_seen.json recruit/data/article_locations.json recruit/data/vision_locations.json
          git diff --cached --quiet || git commit -m "验活结果更新 [skip ci]"
          git push
